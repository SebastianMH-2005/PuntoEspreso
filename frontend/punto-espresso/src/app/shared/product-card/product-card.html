<article class="card h-100 shadow-sm border-0">
  @if (!imagenRota()) {
    <img
      class="card-img-top product-img"
      [src]="urlImagen()"
      [alt]="producto().nombre"
      loading="lazy"
      (error)="imagenRota.set(true)"
    />
  } @else {
    <div
      class="card-img-top product-img d-flex align-items-center justify-content-center bg-cafe-oscuro text-crema"
    >
      <i class="bi bi-cup-hot fs-1"></i>
    </div>
  }

  <div class="card-body d-flex flex-column">
    <span
      class="badge align-self-start mb-2"
      [class.bg-dark]="esGrano()"
      [class.text-warning]="esGrano()"
      [class.bg-warning]="!esGrano()"
      [class.text-dark]="!esGrano()"
    >
      {{ producto().categoria?.nombre ?? 'Sin categoría' }}
    </span>

    <h3 class="h5 card-title" style="color: var(--cafe-oscuro)">{{ producto().nombre }}</h3>
    <p class="card-text text-muted small flex-grow-1">{{ producto().descripcion }}</p>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="fs-5 fw-bold">{{ producto().precio | currency: 'PEN' : 'S/ ' : '1.2-2' }}</span>
      @if (disponible()) {
        <small class="text-success">{{ producto().stock }} disponibles</small>
      } @else {
        <small class="text-danger fw-bold">Agotado</small>
      }
    </div>

    <button
      type="button"
      class="btn btn-cafe w-100"
      [disabled]="restante() <= 0"
      (click)="agregar.emit(producto())"
    >
      @if (!disponible()) {
        Agotado
      } @else if (restante() <= 0) {
        Ya tienes todo el stock en tu carrito
      } @else {
        <i class="bi bi-cart-plus me-1"></i>Agregar al carrito
      }
    </button>
  </div>
</article>
