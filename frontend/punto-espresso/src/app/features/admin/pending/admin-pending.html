<div class="card shadow-sm border-0">
  <div class="card-body text-center p-5">
    <i class="bi bi-tools display-4 text-muted"></i>
    <h2 class="h4 mt-3">{{ seccion() }} se está migrando</h2>
    <p class="text-muted">
      Esta sección todavía no está en la nueva versión. Mientras tanto, puedes usar el panel
      anterior.
    </p>
    <a [href]="panelAnterior" target="_blank" rel="noopener" class="btn btn-cafe">
      Abrir el panel anterior
    </a>
    <p class="small text-muted mt-3 mb-0">
      El panel anterior pide iniciar sesión de nuevo: es un sitio distinto.
    </p>
  </div>
</div>
