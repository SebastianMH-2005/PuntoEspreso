<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Mis pedidos — Punto Espresso</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

<main layout:fragment="content" class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" style="color:#4A2C11;">Mis pedidos</h1>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnActualizar">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
        </button>
    </div>

    <div id="pedidosAcceso" class="alert alert-warning d-none">
        Inicia sesión como cliente para ver tus pedidos.
    </div>
    <div id="pedidosError" class="alert alert-danger d-none"></div>
    <div id="pedidosVacio" class="alert alert-info d-none">
        Aún no tienes pedidos. <a th:href="@{/catalogo}" class="alert-link">Ve al catálogo</a> y haz el primero.
    </div>

    <div id="listaPedidos" class="row g-3"></div>

    <script>
        const ESTADOS = {
            PENDIENTE:  { texto: 'Pendiente',          clase: 'bg-warning text-dark' },
            EN_PROCESO: { texto: 'En proceso',         clase: 'bg-info text-dark' },
            LISTO:      { texto: 'Listo para recoger', clase: 'bg-success' },
            ENTREGADO:  { texto: 'Entregado',          clase: 'bg-secondary' },
            CANCELADO:  { texto: 'Cancelado',          clase: 'bg-danger' }
        };

        function esc(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function headersAuth() {
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem('token')
            };
        }

        async function mensajeError(respuesta, porDefecto) {
            try {
                const datos = await respuesta.json();
                return datos.message || porDefecto;
            } catch (e) {
                return porDefecto;
            }
        }

        function mostrarError(texto) {
            const caja = document.getElementById('pedidosError');
            caja.textContent = texto;
            caja.classList.remove('d-none');
        }

        async function cargarPedidos() {
            document.getElementById('pedidosError').classList.add('d-none');

            if (!localStorage.getItem('token') || localStorage.getItem('rol') !== 'CLIENTE') {
                document.getElementById('pedidosAcceso').classList.remove('d-none');
                return;
            }

            const respuesta = await fetch('/api/pedidos/mis-ordenes', { headers: headersAuth() }).catch(() => null);
            if (!respuesta) {
                mostrarError('No se pudo conectar con el servidor.');
                return;
            }
            if (respuesta.status === 401 || respuesta.status === 403) {
                document.getElementById('pedidosAcceso').classList.remove('d-none');
                return;
            }
            if (!respuesta.ok) {
                mostrarError(await mensajeError(respuesta, 'No se pudieron cargar tus pedidos.'));
                return;
            }

            const pedidos = await respuesta.json();
            document.getElementById('pedidosVacio').classList.toggle('d-none', pedidos.length > 0);
            document.getElementById('listaPedidos').innerHTML = pedidos.map(p => {
                const estado = ESTADOS[p.estado] || { texto: esc(p.estado), clase: 'bg-secondary' };
                const fecha = p.fechaCreacion
                    ? new Date(p.fechaCreacion.substring(0, 19)).toLocaleString('es-PE')
                    : '—';
                const items = p.detalles.map(d =>
                    `<li>${d.cantidad} × ${esc(d.productoNombre)} <span class="text-muted">(S/ ${d.precioUnitario.toFixed(2)})</span></li>`
                ).join('');
                const cancelar = p.estado === 'PENDIENTE'
                    ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelarPedido(${p.idOrden})">Cancelar pedido</button>`
                    : '';

                return `
                    <div class="col-md-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-dark text-warning fs-6">${esc(p.codigoUnico)}</span>
                                    <span class="badge ${estado.clase}">${estado.texto}</span>
                                </div>
                                <p class="text-muted small mb-2">${fecha}${p.sedeNombre ? ' · Recojo en ' + esc(p.sedeNombre) : ''}</p>
                                <ul class="mb-3">${items}</ul>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">Total: S/ ${p.total.toFixed(2)}</span>
                                    ${cancelar}
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function cancelarPedido(id) {
            if (!confirm('¿Seguro que quieres cancelar este pedido?')) return;

            const respuesta = await fetch('/api/pedidos/mis-ordenes/' + id + '/cancelar', {
                method: 'PUT',
                headers: headersAuth()
            });
            if (!respuesta.ok) {
                alert(await mensajeError(respuesta, 'No se pudo cancelar el pedido.'));
            }
            cargarPedidos();
        }

        document.addEventListener('DOMContentLoaded', function () {
            cargarPedidos();
            document.getElementById('btnActualizar').addEventListener('click', cargarPedidos);
            setInterval(cargarPedidos, 30000);
        });
    </script>
</main>

</body>
</html>
