<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Crear cuenta — Punto Espresso</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

<main layout:fragment="content" class="container my-5" style="max-width: 480px;">
    <h1 class="text-center mb-4" style="color:#4A2C11;">Crear cuenta</h1>

    <div id="registroError" class="alert alert-danger d-none" role="alert"></div>
    <div id="registroExito" class="alert alert-success d-none" role="alert">
        Cuenta creada. Ya puedes iniciar sesión.
    </div>

    <form id="formRegistro" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre completo</label>
            <input type="text" class="form-control" id="regNombre" minlength="2" maxlength="100" required>
            <div class="invalid-feedback">Ingresa tu nombre completo (mínimo 2 caracteres).</div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">DNI</label>
            <input type="text" class="form-control" id="regDni" inputmode="numeric" maxlength="8" pattern="\d{8}" required>
            <div class="invalid-feedback">El DNI debe tener 8 dígitos.</div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="regEmail" maxlength="100" required>
            <div class="invalid-feedback">Ingresa un email válido.</div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Teléfono</label>
            <input type="tel" class="form-control" id="regTelefono" inputmode="numeric" maxlength="9" pattern="9\d{8}" required>
            <div class="invalid-feedback">Debe tener 9 dígitos y empezar con 9.</div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control" id="regContrasena" minlength="8" maxlength="72" required>
            <div class="invalid-feedback">La contraseña debe tener entre 8 y 72 caracteres.</div>
        </div>
        <button type="submit" class="btn btn-cafe w-100">Crear cuenta</button>
    </form>

    <p class="text-center mt-3">
        ¿Ya tienes cuenta? <a th:href="@{/}">Inicia sesión desde el inicio</a>
    </p>

<script>
document.getElementById('formRegistro').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
    }

    const errorBox = document.getElementById('registroError');
    const exitoBox = document.getElementById('registroExito');
    errorBox.classList.add('d-none');
    exitoBox.classList.add('d-none');

    const body = {
        nombre: document.getElementById('regNombre').value.trim(),
        dni: document.getElementById('regDni').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        telefono: document.getElementById('regTelefono').value.trim(),
        contrasena: document.getElementById('regContrasena').value
    };

    try {
        const respuesta = await fetch('/api/auth/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (respuesta.status === 409) {
            errorBox.textContent = (await respuesta.text()) || 'Ya existe una cuenta con ese email o DNI.';
            errorBox.classList.remove('d-none');
            return;
        }

        if (respuesta.status === 400) {
            const datos = await respuesta.json().catch(() => null);
            errorBox.textContent = (datos && datos.message) || 'Revisa los datos ingresados.';
            errorBox.classList.remove('d-none');
            return;
        }

        if (!respuesta.ok) {
            errorBox.textContent = 'No se pudo crear la cuenta. Intenta de nuevo.';
            errorBox.classList.remove('d-none');
            return;
        }

        exitoBox.classList.remove('d-none');
        form.reset();
        form.classList.remove('was-validated');
    } catch (err) {
        errorBox.textContent = 'No se pudo crear la cuenta. Intenta de nuevo.';
        errorBox.classList.remove('d-none');
    }
});
</script>
</main>

</body>
</html>
