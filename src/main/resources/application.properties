spring.application.name=puntoEspresso
## Puerto 8080

# --- Conexión a Supabase (Postgres) ---
# En local puedes definir estas variables en tu terminal o en un archivo .env que NO subas a git.
# En Render, las defines como variables de entorno del servicio con estos mismos nombres.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' crea/ajusta las tablas automáticamente según tus entidades.
# Es cómodo mientras aprendes, pero en un proyecto más maduro se reemplaza por migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CORS ---
# Orígenes permitidos para llamar a /api/**. En local usa tu puerto de desarrollo;
# en Render define la variable de entorno APP_CORS_ALLOWED_ORIGINS con tu dominio real de Vercel
# (varios separados por coma, sin espacios, sin barra final).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Swagger / OpenAPI ---
# En Render, si no quieres exponer la documentación públicamente, define
# SPRINGDOC_SWAGGER_UI_ENABLED=false y SPRINGDOC_API_DOCS_ENABLED=false
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

# --- Actuator (monitoreo) ---
# Solo exponemos health e info públicamente; el resto (env, beans, etc.) queda oculto por seguridad.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}