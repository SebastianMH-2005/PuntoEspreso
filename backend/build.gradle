plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.puntoespresso'
version = '0.0.1-SNAPSHOT'
description = 'puntoEspresso'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // El motor web base obligatorio
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Persistencia con base de datos (Supabase Postgres) vía JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
       runtimeOnly 'org.postgresql:postgresql'

    // Migraciones de la base de datos (Flyway). El módulo de PostgreSQL es obligatorio desde Flyway 10
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Documentación automática de la API (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Endpoint de salud para que Render (y cualquier monitor) sepa si el backend sigue vivo
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Herramientas de desarrollo
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Pruebas del sistema
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        // Seguridad y JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
        // Verificación de las credenciales de "Continuar con Google" (firma, vigencia, emisor y audiencia)
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}


tasks.named('test') {
    useJUnitPlatform()
}
