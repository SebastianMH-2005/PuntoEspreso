<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Mi carrito — Punto Espresso</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

<main layout:fragment="content" class="container my-5">
    <h1 class="mb-4" style="color:#4A2C11;">Mi carrito</h1>

    <div id="avisosCarrito" class="alert alert-warning d-none"></div>

    <div id="carritoVacio" class="alert alert-info d-none">
        Tu carrito está vacío. <a th:href="@{/catalogo}" class="alert-link">Explora el catálogo</a>.
    </div>

    <div id="carritoContenido" class="d-none">
        <div id="listaCarrito" class="vstack gap-3 mb-4"></div>

        <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <button type="button" class="btn btn-outline-danger btn-sm" id="btnVaciar">Vaciar carrito</button>
            <span class="fs-4 fw-bold" style="color:#4A2C11;">Total: S/ <span id="totalCarrito">0.00</span></span>
        </div>

        <div class="row g-3 mt-2">
            <div class="col-md-6">
                <a th:href="@{/catalogo}" class="btn btn-outline-secondary w-100 p-3 fw-bold" style="border-radius: 10px;">
                    <i class="bi bi-arrow-left me-1"></i>Seguir comprando
                </a>
            </div>
            <div class="col-md-6">
                <button type="button" id="btnPagar" class="btn w-100 p-3 fw-bold text-white shadow-sm"
                        style="background-color:#4A2C11; border-radius: 10px;">
                    Proceder al pago<i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function mostrarAvisos(avisos) {
            const caja = document.getElementById('avisosCarrito');
            caja.innerHTML = avisos.map(a => '<div>' + escaparHtml(a) + '</div>').join('');
            caja.classList.toggle('d-none', avisos.length === 0);
        }

        function renderizar(items) {
            const vacio = items.length === 0;
            document.getElementById('carritoVacio').classList.toggle('d-none', !vacio);
            document.getElementById('carritoContenido').classList.toggle('d-none', vacio);
            if (vacio) return;

            document.getElementById('listaCarrito').innerHTML = items.map(i => `
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5 class="mb-1" style="color:#4A2C11;">${escaparHtml(i.nombre)}</h5>
                                <span class="text-muted small">S/ ${i.precio.toFixed(2)} c/u · Stock: ${i.stock}</span>
                            </div>
                            <button type="button" class="btn-close" aria-label="Quitar" onclick="quitar(${i.idProducto})"></button>
                        </div>
                        <div class="row g-2 align-items-center mt-2">
                            <div class="col-md-4">
                                <div class="input-group input-group-sm" style="max-width: 140px;">
                                    <button class="btn btn-outline-secondary" type="button" onclick="cambiarCantidad(${i.idProducto}, -1)">-</button>
                                    <input type="text" class="form-control text-center fw-bold" value="${i.cantidad}" readonly>
                                    <button class="btn btn-outline-secondary" type="button" onclick="cambiarCantidad(${i.idProducto}, 1)">+</button>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <input type="text" class="form-control form-control-sm" maxlength="200"
                                       placeholder="Instrucciones (opcional)"
                                       value="${escaparHtml(i.instrucciones || '')}"
                                       onchange="cambiarInstrucciones(${i.idProducto}, this.value)">
                            </div>
                            <div class="col-md-3 text-md-end fw-bold">S/ ${(i.precio * i.cantidad).toFixed(2)}</div>
                        </div>
                    </div>
                </div>`).join('');

            const total = items.reduce((suma, i) => suma + i.precio * i.cantidad, 0);
            document.getElementById('totalCarrito').textContent = (Math.round(total * 100) / 100).toFixed(2);
        }

        function actualizar(items) {
            Carrito.guardar(items);
            renderizar(items);
        }

        function cambiarCantidad(id, delta) {
            const items = Carrito.obtener();
            const item = items.find(i => i.idProducto === id);
            if (!item) return;

            const nueva = item.cantidad + delta;
            if (nueva < 1) return;
            if (nueva > item.stock) {
                alert('Límite de stock alcanzado (' + item.stock + ' unidades disponibles).');
                return;
            }
            item.cantidad = nueva;
            actualizar(items);
        }

        function cambiarInstrucciones(id, texto) {
            const items = Carrito.obtener();
            const item = items.find(i => i.idProducto === id);
            if (!item) return;
            item.instrucciones = texto.trim().substring(0, 200);
            Carrito.guardar(items);
        }

        function quitar(id) {
            actualizar(Carrito.obtener().filter(i => i.idProducto !== id));
        }

        async function cargarCarrito() {
            let avisos = [];
            const guardados = sessionStorage.getItem('avisoCarrito');
            if (guardados) {
                try { avisos = JSON.parse(guardados); } catch (e) { avisos = []; }
                sessionStorage.removeItem('avisoCarrito');
            }

            let items = Carrito.obtener();
            if (items.length > 0) {
                const respuesta = await fetch('/api/productos').catch(() => null);
                if (respuesta && respuesta.ok) {
                    const resultado = Carrito.sincronizar(await respuesta.json());
                    items = resultado.items;
                    avisos = avisos.concat(resultado.cambios);
                }
            }
            mostrarAvisos(avisos);
            renderizar(items);
        }

        document.addEventListener('DOMContentLoaded', function () {
            cargarCarrito();

            document.getElementById('btnVaciar').addEventListener('click', function () {
                if (confirm('¿Vaciar todo el carrito?')) {
                    Carrito.vaciar();
                    renderizar([]);
                }
            });

            document.getElementById('btnPagar').addEventListener('click', function () {
                const token = localStorage.getItem('token');
                if (!token || !tokenVigente(token)) {
                    new bootstrap.Modal(document.getElementById('modalLogin')).show();
                    return;
                }
                if (localStorage.getItem('rol') !== 'CLIENTE') {
                    alert('Solo las cuentas de cliente pueden realizar pedidos.');
                    return;
                }
                window.location.href = '/checkout';
            });
        });
    </script>
</main>

</body>
</html>
